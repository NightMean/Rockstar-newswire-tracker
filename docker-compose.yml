services:
  rockstar-newswire-tracker:
    # build: . # Use this if you want to build locally
    image: nightmean/rockstar-newswire:2.1.0
    container_name: rockstar-newswire-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount config folder containing config.yaml and newswire.json
      - ./config:/usr/src/app/config
    environment:
      # Skip Puppeteer's bundled Chromium download; the image uses system Chrome
      # (already set in the Dockerfile, repeated here for local builds).
      - PUPPETEER_SKIP_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable
      - TZ=${TZ:-UTC}
      # Log verbosity: debug | info | warn | error (default: info)
      # - LOG_LEVEL=info
      # Optional: Override the webhook URL from config.yaml.
      # If not set here, it uses the value from ./config/config.yaml
      # - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/...
